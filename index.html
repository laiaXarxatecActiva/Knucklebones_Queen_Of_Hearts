<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="./public/styles/style.css">
    <script src="dist/mainGame.js" type="module" async></script>
    <title>The Queen's Poker Dice</title>
</head>
<body>

    <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle-checkbox">
    <label for="sidebar-toggle" class="sidebar-toggle-label" aria-label="Toggle sidebar">
        <span></span>
        <span></span>
        <span></span>
    </label>

    <div class="layout">

        <nav class="sidebar">
            <p class="sidebar-title">El Juego de la Reina</p>
            <button type="button" class="sidebar-btn" id="how-to-play-btn">
                <i class="fa fa-diamond"></i>
                Como jugar
            </button>
            <button type="button" class="sidebar-btn" id="round-info">
                <i class="fa fa-heart"></i>
                Información de la partida
            </button>
            <button type="button" class="sidebar-btn">
                Example 3
            </button>
        </nav>
        <label for="sidebar-toggle" class="sidebar-overlay"></label>
    
        <main class="main-content">
            <div class="main-content-game">

                <div class="game-environment" id="opponent">
                    <div class="rand-item">
                        <img id = cpuDice src="#" alt="" width="30pxs">
                    </div>
                    <div class="game-board">
                        <div class="columns">
                            <div class="column">
                                <div class="row"></div>
                                <div class="row"></div>
                                <div class="row"></div>
                            </div>
                            <div class="column">
                                <div class="row"></div>
                                <div class="row"></div>
                                <div class="row"></div>
                            </div>
                            <div class="column">
                                <div class="row"></div>
                                <div class="row"></div>
                                <div class="row"></div>
                            </div>
                        </div>
                        <div class="points">

                        </div>
                    </div>
                    <div class="score">

                    </div>
                </div>

                <div class="game-environment" id="player">
                    <div class="rand-item">
                        <img id = playerDice src="#" alt="" width="30pxs">
                    </div>
                    <div class="game-board">
                        <div class="points">

                        </div>
                        <div class="columns">
                            <div class="column">
                                <div class="row"></div>
                                <div class="row"></div>
                                <div class="row"></div>
                            </div>
                            <div class="column">
                                <div class="row"></div>
                                <div class="row"></div>
                                <div class="row"></div>
                            </div>
                            <div class="column">
                                <div class="row"></div>
                                <div class="row"></div>
                                <div class="row"></div>
                            </div>
                        </div>
                    </div>
                    <div class="score">

                    </div>
                </div>

            </div>

        </main>

    </div>
    
</body>
</html>
