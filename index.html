<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="./public/styles/style.css">
    <script src="dist/mainGame.js" type="module" async></script>
    <title>The Queen's Poker Dice</title>
</head>
<body>

    <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle-checkbox">
    <label for="sidebar-toggle" class="sidebar-toggle-label" aria-label="Toggle sidebar">
        <span></span>
        <span></span>
        <span></span>
    </label>

    <div class="layout">

        <nav class="sidebar">
            <p class="sidebar-title">El Juego de la Reina</p>
            <button type="button" class="sidebar-btn" id="how-to-play-btn">
                <i class="fa fa-diamond"></i>
                Como jugar
            </button>
            <button type="button" class="sidebar-btn" id="round-info">
                <i class="fa fa-heart"></i>
                Información de la partida
            </button>
            <button type="button" class="sidebar-btn">
                Example 3
            </button>
        </nav>
        <label for="sidebar-toggle" class="sidebar-overlay"></label>
    
        <main class="main-content" id="main-content">
            <div class="main-content-game" id="main-content-game">

                <div class="game-environment" id="opponent">
                    <div class="rand-item" id="opponent-rand-item">
                        <img class="dice" id="cpuDice" src="#" alt="">
                    </div>

                    <div class="game-board" id="opponent-game-board">
                        <div class="columns" id="opponent-columns">
                            <div class="column" id="opponent-column-1">
                                <div class="row" id="opponent-row-1-1" style="border-radius: 1rem 0rem 0rem 0rem;"></div>
                                <div class="row" id="opponent-row-1-2"></div>
                                <div class="row" id="opponent-row-1-3" style="border-radius: 0rem 0rem 0rem 1rem;"></div>
                            </div>

                            <div class="column" id="opponent-column-2">
                                <div class="row" id="opponent-row-2-1"></div>
                                <div class="row" id="opponent-row-2-2"></div>
                                <div class="row" id="opponent-row-2-3"></div>
                            </div>

                            <div class="column" id="opponent-column-3">
                                <div class="row" id="opponent-row-3-1" style="border-radius: 0rem 1rem 0rem 0rem;"></div>
                                <div class="row" id="opponent-row-3-2"></div>
                                <div class="row" id="opponent-row-3-3" style="border-radius: 0rem 0rem 1rem 0rem;"></div>
                            </div>
                        </div>

                        <div class="points" id="opponent-points">
                            <div class="column-points" id="opponent-column-points-1">
                                <p>0</p>
                            </div>
                            <div class="column-points" id="opponent-column-points-2">
                                <p>0</p>
                            </div>
                            <div class="column-points" id="opponent-column-points-3">
                                <p>0</p>
                            </div>
                        </div>

                        <div class="name" id="opponent-name">
                            <p>Reina de Naipes</p>
                        </div>
                    </div>

                    <div class="score" id="opponent-score">
                        <p>Total:</p>
                        <span>0</span>
                    </div>
                </div>

                <div class="middle" id="middle">
                    <p>VS</p>
                </div>

                <div class="game-environment" id="player">

                    <div class="rand-item" id="player-rand-item">
                        <img class="dice" id="playerDice" src="#" alt="">
                    </div>

                    <div class="game-board" id="player-game-board">
                        <div class="name" id="player-name">
                            <p>Tú</p>
                        </div>

                        <div class="points" id="player-points">
                            <div class="column-points" id="player-column-points-1">
                                <p>0</p>
                            </div>
                            <div class="column-points" id="player-column-points-2">
                                <p>0</p>
                            </div>
                            <div class="column-points" id="player-column-points-3">
                                <p>0</p>
                            </div>
                        </div>

                        <div class="columns" id="player-columns">
                            <div class="column" id="player-column-1">
                                <div class="row" id="player-row-1-1" style="border-radius: 1rem 0rem 0rem 0rem;"></div>
                                <div class="row" id="player-row-1-2"></div>
                                <div class="row" id="player-row-1-3" style="border-radius: 0rem 0rem 0rem 1rem;"></div>
                            </div>

                            <div class="column" id="player-column-2">
                                <div class="row" id="player-row-2-1"></div>
                                <div class="row" id="player-row-2-2"></div>
                                <div class="row" id="player-row-2-3"></div>
                            </div>

                            <div class="column" id="player-column-3">
                                <div class="row" id="player-row-3-1" style="border-radius: 0rem 1rem 0rem 0rem;"></div>
                                <div class="row" id="player-row-3-2"></div>
                                <div class="row" id="player-row-3-3" style="border-radius: 0rem 0rem 1rem 0rem;"></div>
                            </div>
                        </div>
                    </div>

                    <div class="score" id="player-score">
                        <p>Total:</p>
                        <span>0</span>
                    </div>
                </div>

            </div>

        </main>

    </div>
    
</body>
</html>
